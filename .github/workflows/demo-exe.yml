name: Demo exe

# Run by hand (Actions > Demo exe > Run workflow) on the reviewed commit. It builds albera-demo.exe (scripts/demo-exe): the control room demo with fake VMs and a
# scripted AI, node.exe inside, one file. It publishes nothing: the file stays an Actions artifact until the owner says to attach it to a release.
# Two jobs, as in host-build-hashes.yml: the code that builds is never in the same job as the OIDC token that signs. Every action is pinned to a commit SHA.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build albera-demo.exe (no OIDC token)
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with:
          persist-credentials: false
      # The node.exe that goes into the file is version-pinned. The SHA-256 is the line for node-v<version>-win-x64.zip in https://nodejs.org/dist/v24.13.0/SHASUMS256.txt
      # (read 2026-11-05). To change the version, take both values from the new release and change them together.
      - name: Build
        id: build
        shell: pwsh
        env:
          NODE_PINNED_VERSION: 24.13.0
          NODE_PINNED_ZIP_SHA256: ca2742695be8de44027d71b3f53a4bdb36009b95575fe1ae6f7f0b5ce091cb88
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "node-v$env:NODE_PINNED_VERSION-win-x64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$env:NODE_PINNED_VERSION/$name.zip" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:NODE_PINNED_ZIP_SHA256) { throw "node zip SHA-256 mismatch: expected $env:NODE_PINNED_ZIP_SHA256, got $actual" }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP
          $nodeDir = Join-Path $env:RUNNER_TEMP $name
          $out = Join-Path $env:RUNNER_TEMP 'demo'
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/demo-exe/build.ps1 -NodeDir $nodeDir -OutDir $out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item (Join-Path $out 'albera-demo.exe') dist/
          "sha256=$((Get-FileHash dist/albera-demo.exe -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: albera-demo
          path: dist/albera-demo.exe
          if-no-files-found: error

  attest:
    name: Attest albera-demo.exe
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: albera-demo
          path: dist
      - name: Compare with the hash the build reported
        env:
          WANT: ${{ needs.build.outputs.sha256 }}
        run: echo "$WANT  dist/albera-demo.exe" | sha256sum -c -
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4
        with:
          subject-path: dist/albera-demo.exe
