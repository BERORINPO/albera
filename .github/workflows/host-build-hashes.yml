name: Host build hashes

# Run by hand (Actions > Host build hashes > Run workflow) on the reviewed commit. Windows minutes cost money, so there is no push or pull_request trigger.
# It builds the Broker, the Approval Authority and the pipe client on a clean runner and prints ONE tree hash of the published files: the owner types that value
# as -ExpectedTreeHash into scripts/host/albera-host.ps1 (docs/architecture/host-install.md). It installs and starts nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hashes:
    name: Tree hash of the Windows host builds
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install locked dependencies
        run: npm ci
      - name: Build Windows Broker and pipe client (build only; never installed or started)
        run: npm run build:windows-broker
      - name: Build Approval Authority (build only; never installed or started)
        run: npm run build:approval-authority
      - name: Hash the published files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(& powershell -NoProfile -File scripts/host/albera-host.ps1 -Mode hashes)
          if ($LASTEXITCODE -ne 0) { throw "albera-host.ps1 -Mode hashes failed ($LASTEXITCODE)" }
          $json = @($lines | Where-Object { $_ -like '{*' })
          $tree = @($lines | Where-Object { $_ -like 'ALBERA_HOST_TREE_HASH=*' })
          if ($json.Count -ne 1 -or $tree.Count -ne 1) { throw 'expected one JSON line and one ALBERA_HOST_TREE_HASH= line' }
          [System.IO.File]::WriteAllText("$PWD\build-hashes.json", $json[0], (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "commit=$env:GITHUB_SHA"
          Write-Host $tree[0]
          "commit $env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $tree[0] | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Upload the per-file hashes
        uses: actions/upload-artifact@v4
        with:
          name: build-hashes
          path: build-hashes.json
          if-no-files-found: error
