name: ALBERA checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Keep these job names aligned with main's required status-check contexts.
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20   # Windows jobs ranged 6-10+ minutes on hosted runners (2026-11-01): the ACL integration alone took 4 minutes once
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Set up .NET 10 for the Windows Broker integration
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403   # HOST_BUILD_SDK in scripts/dotnet-build-env.mjs: change both together
      - name: Keep only that SDK (the image ships newer ones, which dotnet would pick first)
        if: runner.os == 'Windows'
        run: node scripts/ci-keep-host-build-sdk.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Build Windows Job Guardian
        if: runner.os == 'Windows'
        run: npm run build:windows-job-guardian
      - name: Build Windows Broker prototype (build only; never installed or started)
        if: runner.os == 'Windows'
        run: npm run build:windows-broker
      - name: Build Control Plane host and app tree (build only; never installed or started)
        if: runner.os == 'Windows'
        run: npm run build:control-plane
      - name: Tests
        run: npm test
      - name: Installed package smoke
        run: npm run package:smoke
      - name: Windows Runtime storage ACL integration
        if: runner.os == 'Windows'
        run: node --test test/runtime-windows-acl.test.mjs
        env:
          ALBERA_RUN_WINDOWS_ACL_INTEGRATION: '1'
      - name: Architecture check
        run: npm run arch
      # The demo exe (scripts/demo-exe) is otherwise only built by the hand-run Demo exe workflow, so a broken Launcher.cs or build.ps1 would surface there.
      # One job only, and only when the change touches scripts/demo-exe/: the build packs node.exe into a zip and compiles, which adds about a minute.
      - name: Demo exe build smoke (only when scripts/demo-exe/ changed)
        if: runner.os == 'Windows' && matrix.node == 24
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BASE_SHA -and $env:BASE_SHA -notmatch '^0+$') {
            git fetch --no-tags --depth=1 origin $env:BASE_SHA
            if ($LASTEXITCODE -ne 0) { throw 'git fetch of the base commit failed' }
            $changed = @(git diff --name-only $env:BASE_SHA HEAD -- scripts/demo-exe)
            if ($LASTEXITCODE -ne 0) { throw 'git diff failed' }
            if ($changed.Count -eq 0) { Write-Output 'scripts/demo-exe/ unchanged: skipped'; exit 0 }
          }
          # The runner's node.exe stands in for the pinned one; the LICENSE file is a placeholder (the release build in demo-exe.yml uses the real zip).
          $node = Join-Path $env:RUNNER_TEMP 'node-for-demo'
          New-Item -ItemType Directory -Force -Path $node | Out-Null
          Copy-Item -LiteralPath (Get-Command node).Source -Destination $node
          Set-Content -LiteralPath (Join-Path $node 'LICENSE') -Value 'CI build smoke only'
          $out = Join-Path $env:RUNNER_TEMP 'demo-smoke'
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/demo-exe/build.ps1 -NodeDir $node -OutDir $out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path -LiteralPath (Join-Path $out 'albera-demo.exe') -PathType Leaf)) { throw 'albera-demo.exe was not built' }
      # Smoke reads the user's local Claude session store; run locally, not on hosted CI.
