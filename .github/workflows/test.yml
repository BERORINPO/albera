name: ALBERA checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Keep these job names aligned with main's required status-check contexts.
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Installed package smoke
        run: npm run package:smoke
      - name: Windows Runtime storage ACL integration
        if: runner.os == 'Windows'
        run: node --test test/runtime-windows-acl.test.mjs
        env:
          ALBERA_RUN_WINDOWS_ACL_INTEGRATION: '1'
      - name: Architecture check
        run: npm run arch
      # Smoke reads the user's local Claude session store; run locally, not on hosted CI.
